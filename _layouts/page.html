---
layout: default
---
<article class="page">
  <header class="page-header">
    <h1 class="page-title">{{ page.title }}</h1>
    {% if page.category or page.status %}
    <div class="page-meta">
      {% if page.category %}<span class="category-badge">{{ page.category }}</span>{% endif %}
      {% if page.status %}<span class="status-badge">{{ page.status }}</span>{% endif %}
    </div>
    {% endif %}
  </header>

  {% if page.thumbnail %}
  <div class="page-thumbnail">
    <img src="{{ page.thumbnail | relative_url }}" alt="{{ page.title }}">
  </div>
  {% endif %}

  <div class="page-content">
    {{ content }}
  </div>

  <nav class="page-nav">
    <a href="/{{ page.lang }}/">&larr; {{ site.data.ui[page.lang].home }}</a>
  </nav>
</article>
