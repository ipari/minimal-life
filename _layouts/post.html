---
layout: default
---
<article class="post">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <time class="post-date" datetime="{{ page.date | date_to_xmlschema }}">
      {% if page.lang == "ko" %}{{ page.date | date: "%Y년 %m월 %d일" }}{% else %}{{ page.date | date: "%B %-d, %Y" }}{% endif %}
    </time>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <nav class="post-nav">
    <a href="/{{ page.lang }}/posts/">&larr; {{ site.data.ui[page.lang].all_posts }}</a>
  </nav>
</article>
